<script>
const data=JSON.parse(document.getElementById('blob').textContent);
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pass){
 const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(data.s),iterations:data.it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(data.i)},key,b64(data.d));
 return new TextDecoder().decode(plain);
}
async function tryPass(pass,silent){
 const msg=document.getElementById('msg'),btn=document.getElementById('b');
 btn.disabled=true; if(!silent){msg.className='ok';msg.textContent='Unlocking…';}
 try{
  const html=await unlock(pass);
  try{sessionStorage.setItem('srgym-k',pass);}catch(e){}
  document.open();document.write(html);document.close();
 }catch(e){
  btn.disabled=false;
  if(!silent){msg.className='';msg.textContent='Wrong key — try again.';}
 }
}
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();const v=document.getElementById('p').value.trim();if(v)tryPass(v,false);});
try{const saved=sessionStorage.getItem('srgym-k');if(saved)tryPass(saved,true);}catch(e){}
</script>
